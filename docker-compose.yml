services:
  dashboard:
    build: .
    container_name: skapi-mw-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8010}:8000"
    networks:
      - skapi
    environment:
      # Общая PostgreSQL (контейнер skool-pg из основного compose Skapi)
      DATABASE_URL: postgresql://skool:${DB_PASSWORD}@skool-pg:5432/skool_api
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Vienna}
      # Монетизация
      PAID_COMMUNITY_SLUG: ${PAID_COMMUNITY_SLUG}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      COMMUNITY_PRICE: ${COMMUNITY_PRICE:-0}
      # Триггер синхронизации → Skapi backend
      SKAPI_BASE_URL: ${SKAPI_BASE_URL:-https://api.skapi.pro}
      SKAPI_ADMIN_SECRET: ${ADMIN_SECRET:-change-me}
      PORT: 8000

networks:
  # Reuse the network that owns skool-pg (created by compose project "skapi")
  skapi:
    external: true
    name: skapi_default
