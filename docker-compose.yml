services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-myapp}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard_net

  dashboard:
    build: .
    container_name: ${PROJECT_NAME:-myapp}_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8001}:8000"
    volumes:
      - ./frontend/dist:/app/frontend/dist    # Hot-swap frontend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DISPLAY_TIMEZONE=${DISPLAY_TIMEZONE:-Europe/Vienna}
      - PORT=8000
    networks:
      - dashboard_net

volumes:
  postgres_data:

networks:
  dashboard_net:
    driver: bridge
